<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ProofLedger — AI Investigation</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
</head>
<body class="app-body">
  <div id="layout"></div>

  <main class="content">
    <section class="page glass slide-in">
      <h1>AI Forensic Analysis & Evidence Correlation</h1>

      <div class="ai-grid">
        <div class="card glass">
          <h3>AI Forensic Analysis</h3>
          <div class="ai-scan" id="aiScanArea">
            <div class="scan-line"></div>
            <div class="ai-legend">
              <div><strong>Evidence:</strong> E-002 Threat Video</div>
              <div><strong>AI-generated probability:</strong> <span id="aiProb">—</span></div>
              <div><strong>Manipulation probability:</strong> <span id="aiManip">—</span></div>
            </div>
            <div id="aiResults" class="muted hidden"></div>
            <div class="actions">
              <button id="runAi" class="btn primary">Run AI Scan</button>
            </div>
          </div>
        </div>

        <div class="card glass">
          <h3>Evidence Correlation</h3>
          <div class="graph" id="corrGraph" aria-hidden="false">
            <!-- Simple interactive graph -->
            <div class="node" data-id="E-001">E-001</div>
            <div class="node center" data-id="E-002">E-002</div>
            <div class="node" data-id="E-009">E-009</div>
            <div class="relation">Confidence: <strong id="relConf">—</strong></div>
            <div class="actions">
              <button id="markRelated" class="btn primary">Mark as Related</button>
              <button id="reviewRel" class="btn ghost">Review Relationship</button>
            </div>
          </div>
        </div>
      </div>

    </section>
  </main>

  <script src="../js/app.js"></script>
  <script src="../js/ai.js"></script>
</body>
</html>
