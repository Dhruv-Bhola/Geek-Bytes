<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Digital DMS — Case Evidence Vault</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
</head>
<body class="app-body">
  <div id="layout"></div>

  <main class="content">
    <section class="page glass slide-in">
      <header class="vault-head">
        <h1>CASE CYB-1042 — Online Harassment</h1>
        <div class="actions"><button class="btn primary">Upload Evidence</button></div>
      </header>

      <nav class="tabs">
        <button class="tab active" data-filter="all">All</button>
        <button class="tab" data-filter="victim">Victim</button>
        <button class="tab" data-filter="police">Police</button>
        <button class="tab" data-filter="forensic">Forensic</button>
      </nav>

      <section id="evidenceList" class="evidence-grid">
        <!-- cards injected by js -->
      </section>
    </section>
  </main>

  <script src="../js/app.js"></script>
  <script src="../js/evidence.js"></script>
</body>
</html>
