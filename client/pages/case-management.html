<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Digital DMS — Case Management</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body class="app-body">
  <div id="layout"></div>

  <main class="content">
    <section class="page glass slide-in">
      <h1>Complaint / Case Details</h1>
      <div class="case-grid">
        <div class="card glass">
          <div class="meta">Complaint</div>
          <h2>CC-10482</h2>
          <div class="small muted">Type: Online Harassment</div>
          <div><strong>Cell:</strong> Cyber Crime / Women Safety</div>
          <div><strong>Status:</strong> <span class="pill info">Under Investigation</span></div>
          <div class="counts">
            <div>Victim Evidence: <strong>5</strong></div>
            <div>Police Evidence: <strong>3</strong></div>
            <div>Forensic Evidence: <strong>2</strong></div>
          </div>
        </div>

        <div class="card glass">
          <div class="meta">Assigned Officer</div>
          <h3>Officer Rahul</h3>
          <div class="actions">
            <button id="createCase" class="btn primary">Create Case</button>
          </div>
          <div id="caseResult" class="muted hidden">
            <div><strong>Case ID:</strong> <span id="newCaseId">—</span></div>
            <div><strong>Status:</strong> <span class="pill success">Open</span></div>
          </div>
        </div>

      </div>
    </section>
  </main>

  <script src="../js/app.js"></script>
  <script src="../js/complaints.js"></script>
</body>
</html>
